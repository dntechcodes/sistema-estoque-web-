{% extends 'estoque/base.html' %}

{% block title %}Editar Produto{% endblock %}

{% block content %}
<div class="grid-layout">
    <div class="card" style="margin: 0 auto; width: 100%; max-width: 600px;">
        <h2 class="card-header">Editar Produto: #{{ produto.id }}</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Nome do Produto</label>
                <!-- O value={{produto.nome}} preenche a caixa com o nome atual -->
                <input type="text" name="nome" value="{{ produto.nome }}" required>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Categoria</label>
                    <select name="categoria_id" required>
                        {% for categoria in categorias %}
                            <!-- A tag IF marca a categoria atual do produto como selecionada -->
                            <option value="{{ categoria.id }}" {% if categoria.id == produto.categoria.id %}selected{% endif %}>
                                {{ categoria.nome }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Preço (R$)</label>
                    <input type="number" step="0.01" name="preco" value="{{ produto.preco|stringformat:'s' }}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Estoque Atual</label>
                    <input type="number" name="estoque_atual" value="{{ produto.estoque_atual }}" required>
                </div>
                <div class="form-group">
                    <label>Estoque Mínimo</label>
                    <input type="number" name="estoque_minimo" value="{{ produto.estoque_minimo }}" required>
                </div>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="submit" class="btn">Guardar Alterações</button>
                <a href="{% url 'produtos' %}" class="btn" style="background-color: #6c757d; text-decoration: none; text-align: center; color: white;">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
